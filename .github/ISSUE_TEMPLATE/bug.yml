name: Bug / typo / broken link
description: A typo, factual error, broken link, or incorrect example in a template.
title: "[bug] "
labels: ["bug"]
body:
  - type: input
    id: file
    attributes:
      label: File
      description: Path of the file with the bug (e.g., `01-icp/ICP.md`).
      placeholder: 01-icp/ICP.md
    validations:
      required: true
  - type: input
    id: line
    attributes:
      label: Line number or section
      description: Line number or section heading where the bug lives, if you know it.
      placeholder: Line 42 or "## Firmographics"
    validations:
      required: false
  - type: textarea
    id: what
    attributes:
      label: What is wrong
      description: Quote the problematic text and describe the bug in one or two sentences.
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: Suggested fix
      description: If you have a proposed correction, paste it here. Optional — we will fix it even if you just describe the bug.
    validations:
      required: false
