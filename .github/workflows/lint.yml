name: Lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli@0.41.0

      - name: Run markdownlint
        run: markdownlint '**/*.md' --ignore node_modules --config .markdownlint.json

  link-check:
    name: Broken link check (report-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --exclude-loopback
            --exclude-mail
            --accept 200,203,204,206,429
            './**/*.md'
          fail: false

  validate-canonical-files:
    name: Validate canonical M10 files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run validate.sh
        run: bash scripts/validate.sh
